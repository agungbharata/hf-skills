<template>
  <!-- reels-typo: ILUSTRASI-sketsa. Ide abstrak: taruh line-art SVG di #x-svgwrap, teks biru/hitam. -->
  <div data-composition-id="SCENE" data-width="720" data-height="1280">
    <div class="stage">
      <div id="x-bg" class="clip bg" data-start="0" data-duration="DUR" data-track-index="0"><div id="x-svgwrap"></div></div>
      <div id="x-cap" class="clip caplayer" data-start="0" data-duration="DUR" data-track-index="1">
        <div id="x-c0" class="cap"><span class="w" id="x-c0-w0">small lead</span><span class="hero" id="x-c0-w1">Hero</span><span class="w tuck" id="x-c0-w2">tucked tail</span></div>
      </div>
    </div>
    <style>
      .stage { position: absolute; inset: 0; overflow: hidden; background: #FDFBFC; font-family: Inter, system-ui, sans-serif; }
      .bg { position: absolute; inset: 0; background: #FDFBFC; }
      #x-svgwrap { position: absolute; left: 0; right: 0; bottom: 80px; height: 620px; }
      #x-svgwrap svg { width: 720px; height: 620px; }
      .caplayer { position: absolute; inset: 0; pointer-events: none; }
      .cap { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; }
      .w { display: block; font-size: 30px; font-weight: 500; color: #111111; opacity: 0; }
      .hero { display: block; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 110px; line-height: 1; color: #1D58FA; opacity: 0; }
      .tuck { margin-top: -14px; }
    </style>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        fetch("SVG_PATH").then(r => r.text()).then(svg => {
          document.querySelector("#x-svgwrap").innerHTML = svg;
          // stroke-draw untuk line-art: sesuaikan selector per SVG
          document.querySelectorAll("#x-svgwrap .draw").forEach((p, i) => {
            const L = 1200;
            tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.1 + i * 0.12);
          });
          window.__timelines["SCENE"] = tl;
        });
        tl.fromTo("#x-c0", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0);
        tl.fromTo("#x-c0-w0", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, 0.1);
        tl.fromTo("#x-c0-w1", { opacity: 0, scale: 1.15, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.3);
        tl.fromTo("#x-c0-w2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, 0.55);
        tl.to("#x-c0", { opacity: 0, duration: 0.2, ease: "power1.in" }, "DUR-0.2");
      })();
    </script>
  </div>
</template>
